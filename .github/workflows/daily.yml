name: Daily articles

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC (07:17 in Türkiye)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's articles even if they already exist"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/daily.yml", "index.html", "js/**", "css/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch today's articles
        run: python scripts/fetch_articles.py ${{ inputs.force && '--force' || '' }}
      - name: Commit new data
        run: |
          git config user.name "daily-articles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles data/index.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily articles $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: rm -rf .github scripts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: first_try
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub's artifact API is sometimes briefly unavailable: wait and try once more.
      - if: steps.first_try.outcome == 'failure'
        run: sleep 60
      - id: deployment
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
